<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emmbros Autocomp Ltd | Auto Parts Mfr in Baddi, HP</title>
    <style>
      html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #fff; }
      #root { height: 100%; width: 100%; overflow: hidden; display: block; }
      
      .page-transition-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
      }
      
      /* Fix for iframe responsiveness on mobile/iOS */
      .emmbros-frame { 
        border: 0; 
        width: 100%; 
        height: 100%; 
        display: block; 
        opacity: 0;
        transition: opacity 0.5s ease-in-out, transform 0.5s ease-out;
        transform: translateY(10px);
      }
      
      .frame-loaded {
        opacity: 1;
        transform: translateY(0);
      }

      .loading-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        pointer-events: none;
      }
      
      .logo-bounce {
        max-width: 200px;
        width: 80vw;
        height: auto;
        animation: logoBounce 1.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.12));
      }
      
      @keyframes logoBounce {
        0%, 100% {
          transform: translateY(0) scale(0.98);
          opacity: 0.85;
        }
        50% {
          transform: translateY(-18px) scale(1.04);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
